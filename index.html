<title>Plotify - Direcciones Visuales</title>
<style>

header{padding:24px;text-align:center;background:white;position:sticky;top:0;border-bottom:1px solid #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:28px;padding:28px}
.card{border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08);background:white}
.title{padding:16px 20px;font-size:22px;font-weight:700}
.mode{padding:10px 16px;font-weight:600}
.mock{height:270px;padding:18px;display:flex}
.sidebar{width:95px;border-radius:12px;padding:12px}
.content{flex:1;margin-left:14px;border-radius:12px;padding:16px}
.top{height:34px;border-radius:8px;margin-bottom:18px}
.kpi{display:flex;gap:10px}.box{flex:1;height:70px;border-radius:10px}
.table div{height:18px;border-radius:5px;margin:10px 0}
</style>
</head>
